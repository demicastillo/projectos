<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Formularios</title></head>
<body>
<!-- Esqueleto para que Netlify Forms registre el formulario de consulta al publicar.
     Los nombres de los campos deben coincidir con los que envía ContactForm. -->
<form name="consulta" data-netlify="true" netlify-honeypot="website" hidden>
  <input type="hidden" name="form-name" value="consulta" />
  <input type="hidden" name="subject" />
  <input type="text" name="nombre" />
  <input type="email" name="email" />
  <input type="text" name="interes" />
  <input type="text" name="nivel" />
  <input type="text" name="modalidad" />
  <input type="text" name="examen" />
  <input type="text" name="whatsapp" />
  <input type="text" name="menor_de_edad" />
  <textarea name="mensaje"></textarea>
  <input type="text" name="website" />
</form>
</body>
</html>
